<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Client Portal 360</title>
    <base href="/ClientMobileApp/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css">
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icon-192.png" />

</head>

<body style="background: #f8fafc; color: #0f172a;">
    <div id="app">
        <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f8fafc;">
            <div style="text-align: center; background: #ffffff; padding: 2.5rem 3rem; border-radius: 12px; border: 1px solid #cbd5e1; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);">
                <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem; color: #1d4ed8 !important;">
                    <span class="visually-hidden">Loading Client Portal...</span>
                </div>
                <h5 style="margin-top: 1.25rem; font-weight: 700; color: #0f172a;">Client Portal 360</h5>
                <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 0;">Loading legal matters &amp; accounting statements...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
</body>

</html>
